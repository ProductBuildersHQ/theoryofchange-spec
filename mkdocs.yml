site_name: Impact Model
site_description: "An AI-native, spec-driven way to model, measure, and report on impact: the theory of change, logic model, and related views of one model"
site_url: https://productbuildershq.com/impact-model
repo_url: https://github.com/ProductBuildersHQ/impact-model
repo_name: ProductBuildersHQ/impact-model

# docs/guides/ holds the user guides and docs/releases/ the release notes.
docs_dir: docs

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Light mode first (ProductBuildersHQ default)
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

# ProductBuildersHQ Theme Assets (served from main site)
extra_css:
  - https://productbuildershq.com/css/productbuildershq-mkdocs.css

extra_javascript:
  - https://productbuildershq.com/js/site-nav.min.js
  - https://productbuildershq.com/js/pbhq-nav.js

# Test fixtures and recorded verdicts are data, not pages.
exclude_docs: |
  evals/fixtures/
  evals/verdicts/
  overrides/

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
      - Overview: guides/index.md
      - Getting Started: guides/getting-started.md
      - Authoring an Impact Model: guides/authoring.md
      - Measuring Progress: guides/measurement.md
      - Reports and Decks: guides/reports-and-decks.md
      - Review Round Trip: guides/review-round-trip.md
      - Quality and Judging: guides/quality-and-judging.md
      - MCP Server and Agent Skills: guides/mcp-and-skills.md
      - Examples: guides/examples.md
      - CLI Reference: guides/cli.md
  - Reference:
      - Concepts to Go Types: concepts.md
      - Research Brief: research/theory-of-change.md
      - Model Feedback from the Examples: design/example-feedback.md
      - Judge Rubric Evaluation: evals/rubric-discrimination.md
      - USM and UFM Integration Contract: integration/usm-ufm-contract.md
      - Credits: credits.md
  - Decisions:
      - 'ADR 0001: Rename to impact-model': design/adrs/0001-rename-to-impact-model.md
  - Specifications:
      - PRD: specs/initiatives/INIT-THEORYOFCHANGESPEC-001/PRD.md
      - TRD: specs/initiatives/INIT-THEORYOFCHANGESPEC-001/TRD.md
      - Plan: specs/initiatives/INIT-THEORYOFCHANGESPEC-001/PLAN.md
      - Roadmap: specs/initiatives/INIT-THEORYOFCHANGESPEC-001/ROADMAP.md
  - Releases:
      - v0.3.0: releases/v0.3.0.md
      - v0.2.0: releases/v0.2.0.md
      - v0.1.0: releases/v0.1.0.md
      - Changelog: releases/changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ProductBuildersHQ/impact-model
