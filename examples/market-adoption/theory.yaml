assumptions:
  - id: asm-first-mover
    statement: Organizations that adopt early gain a competitive advantage, so competitors follow.
    ifThenBecause:
      if: early adopters advertise verified delegation records
      then: competing providers and platforms adopt to keep up
      because: buyers reward visible accountability features
    type: behavioral
    appliesTo:
      - ln-evidence-idp
      - ln-pilot-platform
      - ln-platform-default
      - ln-idp-default
      - ln-default-impact
    criticality: high
    plausibility: medium
    explainsFully: false
    needsTesting: true
    test: Compare win rates in competitive deals between adopters and non-adopters.
    indicatorIds:
      - ind-regional-idps-ga
    evidenceIds:
      - ev-buyer-survey
    status: holding
    ownerActorId: act-wg
    provenance:
      basis: inferred
      evidenceIds:
        - ev-buyer-survey
  - id: asm-idp-no-fork
    statement: Large providers implement the common profile and do not fork incompatible profiles.
    ifThenBecause:
      if: a conformance suite exists
      then: providers pass it as is
      because: interoperability is worth more to them than a private variation
    type: partnership
    appliesTo:
      - ln-suite-idp
    criticality: critical
    plausibility: low
    needsTesting: true
    test: Count incompatible profiles published by providers each quarter and compare against the conformance suite results.
    indicatorIds:
      - ind-asm-fork-profiles
    evidenceIds:
      - ev-fork-profiles
    status: at_risk
    ownerActorId: act-wg
    provenance:
      basis: confirmed
      decidedAt: "2026-09-15"
      decidedBy: Delegation Standard Working Group steering group
  - id: asm-regulation
    statement: The regulator will accept standardized delegation records as compliance evidence.
    ifThenBecause:
      if: the regulator reviews working examples
      then: it names receipt-style records in guidance
      because: it prefers existing standards to prescribing its own
    type: external
    appliesTo:
      - ln-evidence-regulator
      - ln-regulator-recognition
      - ln-auditor-recognition
      - ln-recognition-impact
    criticality: high
    plausibility: medium
    needsTesting: true
    test: Track regulator consultation papers and meeting outcomes.
    indicatorIds:
      - ind-regulator-stage
    evidenceIds:
      - ev-regulator-paper
    status: untested
    ownerActorId: act-wg
    provenance:
      basis: stated
      evidenceIds:
        - ev-regulator-paper
  - id: asm-rival-closed
    statement: The proprietary scheme stays closed and tied to one vendor, so buyers fear lock-in.
    ifThenBecause:
      if: the proprietary vendor keeps the scheme closed
      then: buyers and other vendors prefer a neutral standard
      because: lock-in raises switching cost
    type: contextual
    appliesTo:
      - ln-platform-rival
      - ln-converge-norm
    criticality: medium
    plausibility: high
    evidenceIds:
      - ev-rival-bundling
    status: validated
    provenance:
      basis: inferred
      evidenceIds:
        - ev-rival-bundling
  - id: asm-extension-multihop
    statement: The extension of the older authorization framework cannot express chained, multi-hop delegation.
    ifThenBecause:
      if: buyers need delegation through several agents
      then: the extension is not a substitute
      because: it only expresses a single grant
    type: contextual
    appliesTo:
      - oc-competitor-bridge
      - ln-spec-bridge
      - ln-regional-converge
    criticality: high
    plausibility: low
    needsTesting: true
    test: Review the extension's published roadmap and releases for multi-hop support.
    indicatorIds:
      - ind-asm-extension-multihop
    evidenceIds:
      - ev-extension-multihop
    status: invalidated
    ownerActorId: act-wg
    provenance:
      basis: confirmed
      decidedAt: "2026-09-15"
      decidedBy: Delegation Standard Working Group steering group
  - id: asm-buyers-specify
    statement: Regulated buyers will turn security concerns into RFP requirements once a standard exists.
    ifThenBecause:
      if: a named standard is available from their providers
      then: buyers add it to RFPs
      because: naming a standard makes the requirement checkable
    type: behavioral
    appliesTo:
      - ln-idp-demand
      - ln-platform-demand
      - ln-demand-norm
      - ln-norm-impact
    criticality: high
    plausibility: medium
    evidenceIds:
      - ev-buyer-survey
    status: holding
    provenance:
      basis: stated
      evidenceIds:
        - ev-buyer-survey
  - id: asm-auditors-accept
    statement: Auditors will accept machine-readable receipts as evidence of authorization.
    ifThenBecause:
      if: auditors understand the format
      then: they write it into audit procedures
      because: it is cheaper and more reliable than interviews
    type: behavioral
    appliesTo:
      - ln-auditor-method
      - ln-evidence-auditor
      - ln-auditor-norm
    criticality: high
    plausibility: medium
    needsTesting: true
    test: Interview three assurance firms after the first pilot audits.
    indicatorIds:
      - ind-auditor-stage
    status: untested
    ownerActorId: act-wg
    provenance:
      basis: hypothesis
  - id: asm-libs-cost
    statement: Open-source maintainers add support when integration takes under two days.
    ifThenBecause:
      if: reference code is easy to wrap
      then: maintainers merge support unprompted
      because: contributors want agent features
    type: implementation
    appliesTo:
      - ln-ref-oss
      - ln-oss-platform
      - ln-oss-regional
    criticality: medium
    plausibility: high
    evidenceIds:
      - ev-oss-downloads
    status: validated
    provenance:
      basis: stated
      evidenceIds:
        - ev-oss-downloads
  - id: asm-std-body-timeline
    statement: The neutral standards body completes the liaison agreement within nine months.
    type: partnership
    appliesTo:
      - int-std-body-liaison
      - ln-liaison-spec
    criticality: low
    plausibility: medium
    status: holding
    provenance:
      basis: hypothesis
  - id: asm-pilots-generalize
    statement: Pilot integration costs are representative of the wider market.
    ifThenBecause:
      if: pilots report low cost
      then: other organizations expect similar cost
      because: pilot partners resemble typical adopters
    type: causal
    appliesTo:
      - ln-spec-pilot
      - ln-evidence-regional
    criticality: medium
    plausibility: medium
    needsTesting: true
    test: Compare cost reports from later adopters with pilot figures.
    indicatorIds:
      - ind-pilots-live
    status: untested
    provenance:
      basis: hypothesis
