kind: TheoryOfChange
specVersion: "0.1"
id: delegation-standard-adoption
metadata:
  name: Delegation Receipt standard adoption (fictional example)
  description: A fictional theory of change for driving an invented open standard, the Delegation Receipt, to adoption in a market with competing approaches. Every organization, number, and URL is invented.
  status: draft
  owner: Delegation Standard Working Group
  tags:
    - market-systems
    - standards
    - aaer
    - fictional
perspective:
  actorId: act-wg
  role: proponent
  futureRef: ufm:open-delegation-wins
context:
  problemStatement: When a person delegates authority to an AI agent, the grant is recorded in incompatible, vendor-specific ways, so organizations cannot show who authorized what an agent did.
  rootCauses:
    - No shared format for expressing and recording delegated authority
    - Each provider and platform records grants privately, so records cannot be compared or audited
    - Buyers lack a concrete standard to name in procurement and audit requirements
  targetPopulation: Identity providers, agent platforms, enterprise buyers, auditors, and regulators in the agent-delegation market
  market:
    framework: market_spec
    ref: market:agent-delegation
    url: https://example.org/markets/agent-delegation
    relation: same_as
    attributes:
      segment: enterprise
  geography: Global
  timeHorizon:
    start: "2026-01-01"
    end: "2029-12-31"
  narrative: The working group controls the specification, reference code, and conformance tests. If pilots show low integration cost, large and regional identity providers and agent platforms adopt on their own (Adopt and Adapt). Visible adoption leads buyers to name the standard in procurement and competing approaches to publish mappings to it (Expand), while auditors and the regulator adjust their practice (Respond). A proprietary vendor will answer with bundling, which the theory treats as a balancing loop. Market-wide traceability sits above the ceiling of accountability, so the group owns the conditions up to long-term outcomes and only monitors the impact.
ceilingOfAccountability:
  level: long_term
  rationale: The working group can specify, demonstrate, and persuade, but whether agent actions across the whole market become traceable depends on thousands of independent organizations, so the impact is tracked and not owned.
outcomes:
  - id: oc-traceable-actions
    title: Agent actions across the market are traceable to a human grant
    description: For most consequential agent actions, an independent party can find the human grant that authorized them.
    level: impact
    sphere: interest
    category: respond
    changeType: condition
    population: All organizations deploying or relying on AI agents
    provenance:
      basis: confirmed
      decidedAt: "2026-02-10"
      decidedBy: Delegation Standard Working Group steering group
  - id: oc-procurement-norm
    title: Enterprise buyers require the standard in agent procurement
    description: Procurement templates and security questionnaires name receipts as a requirement, so supporting it is a condition of selling.
    level: long_term
    sphere: influence
    logic:
      type: at_least
      k: 2
    category: expand
    changeType: norm
    population: Enterprise buyers of agent platforms and identity services
    actorIds:
      - act-ent-regulated
      - act-ent-general
    provenance:
      basis: inferred
      evidenceIds:
        - ev-buyer-survey
      note: Inferred from survey intent; two of the three preconditions are enough because each route reaches a different buyer group.
  - id: oc-regulatory-recognition
    title: The regulator recognizes receipts as a way to evidence delegated authority
    level: long_term
    sphere: interest
    logic:
      type: all
    category: respond
    changeType: policy
    actorIds:
      - act-regulator
    provenance:
      basis: hypothesis
      note: Depends on regulator timing the group does not control.
  - id: oc-default-practice
    title: Receipts are the default way agent platforms record delegated authority
    level: long_term
    sphere: influence
    category: expand
    changeType: practice
    population: Agent platforms and the enterprises that run them
    actorIds:
      - act-agent-platforms
      - act-agent-builders
    provenance:
      basis: inferred
      evidenceIds:
        - ev-oss-downloads
  - id: oc-competitor-converge
    title: Competing approaches interoperate with the standard
    description: Both competing archetypes can export or accept receipts, so buyers need not choose a side.
    level: long_term
    sphere: interest
    logic:
      type: any
    category: expand
    changeType: practice
    actorIds:
      - act-comp-proprietary
      - act-comp-extension
    provenance:
      basis: hypothesis
  - id: oc-idp-ship
    title: Large identity providers ship the standard in general availability
    level: intermediate
    sphere: influence
    logic:
      type: all
    category: adopt
    changeType: adoption
    actorIds:
      - act-idp-large
    tags:
      - supply
    provenance:
      basis: stated
      evidenceIds:
        - ev-buyer-survey
      note: Providers told the survey they would ship once a conformance suite exists.
  - id: oc-regional-idp-ship
    title: Regional identity providers adopt on their own investment
    description: Smaller providers integrate using open libraries and pilot results, without direct support from the working group.
    level: intermediate
    sphere: influence
    logic:
      type: any
    category: adapt
    changeType: investment
    actorIds:
      - act-idp-regional
    tags:
      - supply
    provenance:
      basis: inferred
      evidenceIds:
        - ev-oss-downloads
  - id: oc-platform-adopt
    title: Agent platforms emit receipts for delegated actions
    level: intermediate
    sphere: influence
    category: adopt
    changeType: adoption
    actorIds:
      - act-agent-platforms
    tags:
      - supply
    provenance:
      basis: stated
      evidenceIds:
        - ev-pilot-cost
  - id: oc-buyer-demand
    title: Regulated enterprise buyers ask for receipts in RFPs
    description: Positive links count as preconditions; the negative link from rival momentum dampens demand but is not a precondition.
    level: intermediate
    sphere: influence
    logic:
      type: any
    category: adapt
    changeType: practice
    population: Regulated enterprise buyers
    actorIds:
      - act-ent-regulated
    tags:
      - demand
    provenance:
      basis: stated
      evidenceIds:
        - ev-buyer-survey
  - id: oc-auditor-method
    title: Auditors accept receipts as audit evidence
    level: intermediate
    sphere: influence
    logic:
      type: all
    category: respond
    changeType: practice
    actorIds:
      - act-assurance-firm
    provenance:
      basis: inferred
      evidenceIds:
        - ev-auditor-interviews
  - id: oc-regulator-guidance
    title: The regulator publishes guidance that names receipt-style records
    level: intermediate
    sphere: interest
    category: respond
    changeType: policy
    actorIds:
      - act-regulator
    provenance:
      basis: stated
      evidenceIds:
        - ev-regulator-paper
  - id: oc-rival-momentum
    title: The proprietary scheme gains momentum through bundling
    description: A competitive response to visible adoption, tracked because it reduces adopter intent.
    level: intermediate
    sphere: interest
    category: respond
    changeType: practice
    actorIds:
      - act-comp-proprietary
    tags:
      - competitive-response
    provenance:
      basis: stated
      evidenceIds:
        - ev-rival-bundling
  - id: oc-oss-libs
    title: Open-source libraries add receipt support
    description: Maintainers add support because it is cheap, not because the working group asks.
    level: intermediate
    sphere: influence
    category: expand
    changeType: adoption
    actorIds:
      - act-oss-community
    provenance:
      basis: stated
      evidenceIds:
        - ev-oss-downloads
  - id: oc-competitor-bridge
    title: Competing approaches publish mappings to the standard
    level: intermediate
    sphere: influence
    category: expand
    changeType: practice
    actorIds:
      - act-comp-extension
    provenance:
      basis: hypothesis
  - id: oc-central-registry
    title: A central registry of delegation issuers is operated
    description: Considered as a way to speed trust between providers and rejected, because it would add a single point of control and slow adoption.
    level: intermediate
    sphere: control
    category: adopt
    changeType: condition
    provenance:
      basis: rejected
      note: Rejected in favor of decentralized issuers.
      decidedAt: "2026-05-12"
      decidedBy: Delegation Standard Working Group steering group
  - id: oc-spec-stable
    title: Specification 1.0 is stable and interoperable
    level: short_term
    sphere: control
    category: adopt
    changeType: condition
    actorIds:
      - act-wg
    provenance:
      basis: confirmed
      decidedAt: "2026-02-10"
      decidedBy: Delegation Standard Working Group steering group
  - id: oc-pilot-adopters
    title: Pilot adopters run receipts in production
    level: short_term
    sphere: influence
    logic:
      type: at_least
      k: 2
    category: adopt
    changeType: adoption
    population: Pilot organizations across providers, platforms, and buyers
    actorIds:
      - act-idp-large
      - act-agent-platforms
      - act-ent-regulated
    provenance:
      basis: confirmed
      decidedAt: "2026-02-10"
      decidedBy: Delegation Standard Working Group steering group
  - id: oc-pilot-evidence
    title: Published pilot results show low integration cost
    level: short_term
    sphere: influence
    category: adopt
    changeType: knowledge
    provenance:
      basis: inferred
      evidenceIds:
        - ev-pilot-cost
  - id: oc-auditor-awareness
    title: Auditors understand the receipt format and its evidential value
    level: short_term
    sphere: influence
    category: respond
    changeType: knowledge
    actorIds:
      - act-assurance-firm
    provenance:
      basis: inferred
      evidenceIds:
        - ev-auditor-interviews
  - id: oc-reference-impl
    title: Open reference implementations exist in three languages
    level: output
    sphere: control
    provenance:
      basis: confirmed
      decidedAt: "2026-02-10"
      decidedBy: Delegation Standard Working Group steering group
  - id: oc-conformance-suite
    title: A public conformance test suite exists
    level: output
    sphere: control
    provenance:
      basis: confirmed
      decidedAt: "2026-02-10"
      decidedBy: Delegation Standard Working Group steering group
  - id: oc-std-body-liaison
    title: A liaison agreement with the neutral standards body is in place
    level: output
    sphere: control
    actorIds:
      - act-std-body
    provenance:
      basis: hypothesis
preconditionGroups:
  - id: grp-platform-routes
    target: oc-platform-adopt
    members:
      - oc-pilot-adopters
      - oc-oss-libs
    logic:
      type: any
    sufficiency: Either route alone is enough, since a platform can follow a pilot partner or pick up an open library.
    provenance:
      basis: inferred
      evidenceIds:
        - ev-oss-downloads
  - id: grp-default-all
    target: oc-default-practice
    members:
      - oc-platform-adopt
      - oc-idp-ship
    logic:
      type: all
    sufficiency: A default needs both the emitting side and the verifying side of the market.
    provenance:
      basis: hypothesis
  - id: grp-market-pull
    target: oc-traceable-actions
    members:
      - oc-procurement-norm
      - oc-default-practice
    logic:
      type: all
    sufficiency: Buyer demand and platform practice together make traceability the norm.
    provenance:
      basis: hypothesis
  - id: grp-impact-routes
    target: oc-traceable-actions
    members:
      - grp-market-pull
      - oc-regulatory-recognition
    logic:
      type: any
    sufficiency: Market pull (procurement norm AND default practice) OR regulatory recognition is judged sufficient, giving (A AND B) OR C.
    provenance:
      basis: hypothesis
links:
  - id: ln-ref-pilot
    from: oc-reference-impl
    to: oc-pilot-adopters
    type: contributes_to
    rationale: Reference code lowers the cost for a pilot to start.
    lag: P3M
    provenance:
      basis: confirmed
      decidedAt: "2026-02-10"
      decidedBy: Delegation Standard Working Group steering group
  - id: ln-suite-pilot
    from: oc-conformance-suite
    to: oc-pilot-adopters
    type: enables
    rationale: Pilots need a way to prove they interoperate.
    lag: P3M
    provenance:
      basis: confirmed
      decidedAt: "2026-02-10"
      decidedBy: Delegation Standard Working Group steering group
  - id: ln-spec-pilot
    from: oc-spec-stable
    to: oc-pilot-adopters
    type: necessary_condition
    rationale: No organization runs a draft in production.
    assumptionIds:
      - asm-pilots-generalize
    lag: P3M
    provenance:
      basis: confirmed
      decidedAt: "2026-02-10"
      decidedBy: Delegation Standard Working Group steering group
  - id: ln-liaison-spec
    from: oc-std-body-liaison
    to: oc-spec-stable
    type: enables
    rationale: Neutral stewardship reassures adopters that the specification will not be steered by one vendor.
    assumptionIds:
      - asm-std-body-timeline
    lag: P9M
    provenance:
      basis: hypothesis
  - id: ln-pilot-evidence
    from: oc-pilot-adopters
    to: oc-pilot-evidence
    type: causes
    rationale: Running pilots produces the cost and effort data that is then published.
    interventionIds:
      - int-adoption-cost-study
    lag: P6M
    provenance:
      basis: inferred
      evidenceIds:
        - ev-pilot-cost
  - id: ln-evidence-idp
    from: oc-pilot-evidence
    to: oc-idp-ship
    type: contributes_to
    rationale: Providers commit when integration cost is shown to be low.
    assumptionIds:
      - asm-first-mover
    evidenceIds:
      - ev-pilot-cost
    lag: P6M
    provenance:
      basis: stated
      evidenceIds:
        - ev-pilot-cost
  - id: ln-suite-idp
    from: oc-conformance-suite
    to: oc-idp-ship
    type: necessary_condition
    rationale: Providers told the survey they will not ship without a way to certify interoperability.
    assumptionIds:
      - asm-idp-no-fork
    evidenceIds:
      - ev-buyer-survey
    interventionIds:
      - int-conformance-testing
    lag: P6M
    provenance:
      basis: stated
      evidenceIds:
        - ev-buyer-survey
  - id: ln-pilot-platform
    from: oc-pilot-adopters
    to: oc-platform-adopt
    type: causes
    rationale: Platforms that pilot with a partner keep the integration and extend it to all agents.
    assumptionIds:
      - asm-first-mover
    lag: P6M
    provenance:
      basis: inferred
      evidenceIds:
        - ev-pilot-cost
  - id: ln-oss-platform
    from: oc-oss-libs
    to: oc-platform-adopt
    type: enables
    rationale: Platforms adopt open libraries instead of writing their own recording format.
    assumptionIds:
      - asm-libs-cost
    lag: P6M
    provenance:
      basis: inferred
      evidenceIds:
        - ev-oss-downloads
  - id: ln-ref-oss
    from: oc-reference-impl
    to: oc-oss-libs
    type: contributes_to
    rationale: Maintainers fork or wrap the reference code.
    assumptionIds:
      - asm-libs-cost
    lag: P3M
    provenance:
      basis: stated
      evidenceIds:
        - ev-oss-downloads
  - id: ln-oss-regional
    from: oc-oss-libs
    to: oc-regional-idp-ship
    type: enables
    rationale: Regional providers lack large engineering teams and rely on open libraries.
    assumptionIds:
      - asm-libs-cost
    lag: P6M
    provenance:
      basis: inferred
      evidenceIds:
        - ev-oss-downloads
  - id: ln-evidence-regional
    from: oc-pilot-evidence
    to: oc-regional-idp-ship
    type: contributes_to
    rationale: Published results let smaller providers justify the work without a pilot of their own.
    assumptionIds:
      - asm-pilots-generalize
    lag: P9M
    provenance:
      basis: hypothesis
  - id: ln-idp-demand
    from: oc-idp-ship
    to: oc-buyer-demand
    type: enables
    rationale: Buyers only ask for features they can obtain from their identity provider.
    assumptionIds:
      - asm-buyers-specify
    lag: P6M
    provenance:
      basis: stated
      evidenceIds:
        - ev-buyer-survey
  - id: ln-platform-demand
    from: oc-platform-adopt
    to: oc-buyer-demand
    type: contributes_to
    rationale: Seeing receipts on platforms they already use prompts buyers to require them of others.
    assumptionIds:
      - asm-buyers-specify
    interventionIds:
      - int-buyer-kit
    lag: P6M
    provenance:
      basis: inferred
      evidenceIds:
        - ev-buyer-survey
  - id: ln-platform-rival
    from: oc-platform-adopt
    to: oc-rival-momentum
    type: causes
    rationale: Visible adoption threatens the proprietary vendor's position and provokes a bundling response.
    assumptionIds:
      - asm-rival-closed
    evidenceIds:
      - ev-rival-bundling
    lag: P3M
    provenance:
      basis: stated
      evidenceIds:
        - ev-rival-bundling
  - id: ln-rival-demand
    from: oc-rival-momentum
    to: oc-buyer-demand
    type: causes
    rationale: Discounted bundles reduce buyers' willingness to specify a standard that would let them switch.
    polarity: negative
    lag: P6M
    provenance:
      basis: inferred
      evidenceIds:
        - ev-rival-bundling
  - id: ln-spec-auditor
    from: oc-spec-stable
    to: oc-auditor-awareness
    type: enables
    rationale: Auditors study a stable text, not a draft.
    lag: P6M
    provenance:
      basis: hypothesis
  - id: ln-auditor-method
    from: oc-auditor-awareness
    to: oc-auditor-method
    type: causes
    rationale: Understanding the format is the basis for writing it into audit procedures.
    assumptionIds:
      - asm-auditors-accept
    lag: P12M
    provenance:
      basis: inferred
      evidenceIds:
        - ev-auditor-interviews
  - id: ln-evidence-auditor
    from: oc-pilot-evidence
    to: oc-auditor-method
    type: contributes_to
    rationale: Pilot records show auditors the receipts hold up in real engagements.
    assumptionIds:
      - asm-auditors-accept
    lag: P12M
    provenance:
      basis: hypothesis
  - id: ln-evidence-regulator
    from: oc-pilot-evidence
    to: oc-regulator-guidance
    type: contributes_to
    rationale: A regulator drafting guidance looks for working examples.
    assumptionIds:
      - asm-regulation
    interventionIds:
      - int-regulator-briefings
    lag: P12M
    provenance:
      basis: stated
      evidenceIds:
        - ev-regulator-paper
  - id: ln-spec-bridge
    from: oc-spec-stable
    to: oc-competitor-bridge
    type: enables
    rationale: A competitor can only map to a specification that will not change under it.
    assumptionIds:
      - asm-extension-multihop
    lag: P9M
    provenance:
      basis: hypothesis
  - id: ln-bridge-converge
    from: oc-competitor-bridge
    to: oc-competitor-converge
    type: causes
    rationale: A published mapping is the practical step toward interoperating.
    lag: P12M
    provenance:
      basis: hypothesis
  - id: ln-regional-converge
    from: oc-regional-idp-ship
    to: oc-competitor-converge
    type: contributes_to
    rationale: Once regional providers hold a real installed base, competitors face customer pressure to interoperate.
    assumptionIds:
      - asm-extension-multihop
    lag: P12M
    provenance:
      basis: hypothesis
  - id: ln-demand-norm
    from: oc-buyer-demand
    to: oc-procurement-norm
    type: causes
    rationale: Repeated RFP language becomes a standard procurement clause.
    assumptionIds:
      - asm-buyers-specify
    lag: P12M
    provenance:
      basis: inferred
      evidenceIds:
        - ev-buyer-survey
  - id: ln-auditor-norm
    from: oc-auditor-method
    to: oc-procurement-norm
    type: contributes_to
    rationale: Buyers follow what their auditors will examine.
    assumptionIds:
      - asm-auditors-accept
    lag: P12M
    provenance:
      basis: hypothesis
  - id: ln-converge-norm
    from: oc-competitor-converge
    to: oc-procurement-norm
    type: enables
    rationale: When rivals interoperate, buyers can require the standard without picking a vendor.
    assumptionIds:
      - asm-rival-closed
    lag: P12M
    provenance:
      basis: hypothesis
  - id: ln-platform-default
    from: oc-platform-adopt
    to: oc-default-practice
    type: causes
    rationale: Receipts that agents emit become the common record when enough platforms do it.
    assumptionIds:
      - asm-first-mover
    lag: P12M
    provenance:
      basis: inferred
      evidenceIds:
        - ev-oss-downloads
  - id: ln-idp-default
    from: oc-idp-ship
    to: oc-default-practice
    type: necessary_condition
    rationale: Receipts must be verifiable by the identity systems that enterprises already trust.
    assumptionIds:
      - asm-first-mover
    lag: P12M
    provenance:
      basis: hypothesis
  - id: ln-regulator-recognition
    from: oc-regulator-guidance
    to: oc-regulatory-recognition
    type: causes
    rationale: Guidance is the step before formal recognition.
    assumptionIds:
      - asm-regulation
    lag: P18M
    provenance:
      basis: hypothesis
  - id: ln-auditor-recognition
    from: oc-auditor-method
    to: oc-regulatory-recognition
    type: contributes_to
    rationale: Regulators lean on audit practice that already exists.
    assumptionIds:
      - asm-regulation
    lag: P18M
    provenance:
      basis: hypothesis
  - id: ln-norm-impact
    from: oc-procurement-norm
    to: oc-traceable-actions
    type: contributes_to
    rationale: A procurement norm makes traceability a condition of sale across the market.
    assumptionIds:
      - asm-buyers-specify
    lag: P18M
    provenance:
      basis: inferred
      evidenceIds:
        - ev-buyer-survey
  - id: ln-default-impact
    from: oc-default-practice
    to: oc-traceable-actions
    type: contributes_to
    rationale: When recording grants is the default, traceability follows without a separate effort.
    assumptionIds:
      - asm-first-mover
    lag: P18M
    provenance:
      basis: hypothesis
  - id: ln-recognition-impact
    from: oc-regulatory-recognition
    to: oc-traceable-actions
    type: contributes_to
    rationale: Regulatory recognition reaches organizations that markets alone would not.
    assumptionIds:
      - asm-regulation
    lag: P24M
    provenance:
      basis: hypothesis
  - id: ln-default-platform-loop
    from: oc-default-practice
    to: oc-platform-adopt
    type: enables
    rationale: Network effect. The more counterparties accept receipts, the more valuable it is for any platform to emit them.
    feedback: true
    loopType: reinforcing
    lag: P12M
    provenance:
      basis: inferred
      evidenceIds:
        - ev-oss-downloads
  - id: ln-rival-platform-loop
    from: oc-rival-momentum
    to: oc-platform-adopt
    type: causes
    rationale: Competitive response. Bundled discounts pull platforms back toward the proprietary scheme, which slows adoption and so dampens the trigger for further bundling.
    polarity: negative
    feedback: true
    loopType: balancing
    lag: P6M
    provenance:
      basis: inferred
      evidenceIds:
        - ev-rival-bundling
  - id: ln-regional-oss-loop
    from: oc-regional-idp-ship
    to: oc-oss-libs
    type: contributes_to
    rationale: Regional deployments bring bug reports and patches back to the open libraries, which makes them cheaper for the next adopter.
    feedback: true
    loopType: reinforcing
    lag: P9M
    provenance:
      basis: hypothesis
  - id: ln-registry-default
    from: oc-central-registry
    to: oc-default-practice
    type: enables
    rationale: A registry was expected to speed trust between providers.
    provenance:
      basis: rejected
      decidedAt: "2026-05-12"
      decidedBy: Delegation Standard Working Group steering group
interventions:
  - id: int-spec-drafting
    title: Draft and ratify specification 1.0
    description: Open drafting process with public review rounds and a ratification vote of working group members.
    type: standardization
    targets:
      - oc-spec-stable
    outputs:
      - Specification 1.0
      - Public review log
    ownerActorId: act-wg
    status: in_progress
    capabilities:
      - capabilityId: cap-spec-editing
        relation: enables
    initiativeRefs:
      - framework: visionstudio
        ref: INIT-EXAMPLE-001
        relation: implements
    resources: Two editors and a review budget
    provenance:
      basis: confirmed
      decidedAt: "2026-02-10"
      decidedBy: Delegation Standard Working Group steering group
  - id: int-reference-impls
    title: Publish open reference implementations
    type: product
    targets:
      - oc-reference-impl
      - oc-oss-libs
    outputs:
      - Reference libraries in three languages
    ownerActorId: act-oss-community
    status: in_progress
    capabilities:
      - capabilityId: cap-reference-code
        relation: improves
    initiativeRefs:
      - framework: visionstudio
        ref: INIT-EXAMPLE-002
        relation: implements
    provenance:
      basis: confirmed
      decidedAt: "2026-02-10"
      decidedBy: Delegation Standard Working Group steering group
  - id: int-conformance-testing
    title: Build and run a public conformance test suite
    type: standardization
    targets:
      - oc-conformance-suite
    outputs:
      - Conformance suite
