externalFactors:
  - id: ef-regulation-wave
    description: Several jurisdictions are drafting accountability rules for automated agents.
    kind: enabler
    affects:
      - oc-regulatory-recognition
      - oc-regulator-guidance
    likelihood: medium
    trend: up
    provenance:
      basis: stated
      evidenceIds:
        - ev-regulator-paper
  - id: ef-agent-growth
    description: The number of enterprise agent deployments is growing quickly.
    kind: trend
    affects:
      - oc-platform-adopt
      - oc-buyer-demand
    likelihood: high
    trend: up
    provenance:
      basis: inferred
      evidenceIds:
        - ev-buyer-survey
  - id: ef-incident
    description: A widely reported incident of an agent acting without authorization could sharply raise demand.
    kind: shock
    affects:
      - oc-buyer-demand
      - oc-regulator-guidance
    likelihood: medium
    trend: unknown
    provenance:
      basis: hypothesis
  - id: ef-procurement-cycles
    description: Large enterprises renew platform contracts only every two to three years, which slows how fast RFP language can change.
    kind: constraint
    affects:
      - oc-procurement-norm
    likelihood: high
    trend: flat
    provenance:
      basis: inferred
      evidenceIds:
        - ev-buyer-survey
risks:
  - id: rsk-early-share
    description: The proprietary scheme gains early share through bundling and becomes the default before the standard reaches critical mass.
    impact: high
    probability: medium
    mitigation: Ship pilots and mapping profiles early, and publish cost evidence.
    status: open
    owner: Delegation Standard Working Group
    appliesTo:
      - oc-rival-momentum
      - oc-platform-adopt
    category: market
    relatedAssumptionIds:
      - asm-rival-closed
      - asm-first-mover
    provenance:
      basis: stated
      evidenceIds:
        - ev-rival-bundling
  - id: rsk-profile-split
    description: Large providers publish incompatible profiles, splitting the standard.
    impact: critical
    probability: high
    mitigation: Put profile governance under the standards body and make conformance results public.
    status: mitigating
    owner: Delegation Standard Working Group
    appliesTo:
      - oc-idp-ship
      - oc-conformance-suite
    category: partnership
    relatedAssumptionIds:
      - asm-idp-no-fork
    provenance:
      basis: stated
      evidenceIds:
        - ev-fork-profiles
  - id: rsk-regulator-delay
    description: The regulator moves slower than expected or chooses a different instrument.
    impact: medium
    probability: medium
    mitigation: Do not rely on regulatory recognition; keep market pull as the independent route.
    status: open
    owner: Delegation Standard Working Group
    appliesTo:
      - oc-regulatory-recognition
    category: environmental_political
    relatedAssumptionIds:
      - asm-regulation
    provenance:
      basis: inferred
      evidenceIds:
        - ev-regulator-paper
  - id: rsk-extension-substitute
    description: The extension of the older framework proves good enough, and buyers see no reason to adopt a new standard.
    impact: high
    probability: medium
    mitigation: Show gaps that matter to buyers and publish a mapping profile that lets both coexist.
    status: open
    owner: Delegation Standard Working Group
    appliesTo:
      - oc-competitor-bridge
      - oc-buyer-demand
    category: market
    relatedAssumptionIds:
      - asm-extension-multihop
    provenance:
      basis: stated
      evidenceIds:
        - ev-extension-multihop
  - id: rsk-maintainer-fatigue
    description: Volunteer maintainers of the reference libraries stop contributing.
    impact: medium
    probability: low
    mitigation: Fund two maintainers and move stewardship to the standards body.
    status: open
    owner: Delegation Standard Working Group
    appliesTo:
      - oc-reference-impl
      - oc-oss-libs
    category: operational
    relatedAssumptionIds:
      - asm-libs-cost
    provenance:
      basis: hypothesis
