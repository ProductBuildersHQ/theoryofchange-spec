actorRegistry: delegation-market-actors
evidence:
  - id: ev-buyer-survey
    title: Survey of enterprise security leaders on agent delegation records
    type: research
    strength: moderate
    direction: supports
    processTracingTest: straw_in_the_wind
    source: Example research firm
    url: https://example.org/evidence/buyer-delegation-survey
    summary: Most respondents plan to ask for verifiable delegation records, and providers said they would ship once a conformance suite exists.
    excerpt: A majority of buyer respondents expect to require verifiable delegation records within two years.
    sensitivity: public
    accessedAt: "2026-02-01"
  - id: ev-pilot-cost
    title: Early pilot integration cost report
    type: evaluation
    strength: moderate
    direction: supports
    processTracingTest: hoop
    source: Working group pilot program
    url: https://example.org/evidence/pilot-integration-cost
    summary: The first three pilots integrated within an average of nine working days.
    sensitivity: public
    accessedAt: "2026-08-20"
  - id: ev-regulator-paper
    title: Regulator discussion paper on automated agents
    type: market_signal
    strength: moderate
    direction: supports
    processTracingTest: hoop
    source: Digital accountability regulator
    url: https://example.org/evidence/regulator-discussion-paper
    summary: The paper invites comment on standardized records of delegated authority.
    sensitivity: public
    accessedAt: "2026-04-14"
  - id: ev-extension-multihop
    title: Extension working draft adds chained delegation
    type: market_signal
    strength: strong
    direction: contradicts
    processTracingTest: smoking_gun
    source: Extension working group
    url: https://example.org/evidence/extension-draft-multihop
    summary: A published draft of the older-framework extension describes multi-hop delegation, contradicting the claim that it cannot.
    sensitivity: public
    accessedAt: "2026-09-10"
  - id: ev-fork-profiles
    title: Two incompatible provider profiles published
    type: monitoring_data
    strength: moderate
    direction: contradicts
    processTracingTest: hoop
    source: Conformance suite results
    url: https://example.org/evidence/provider-profile-divergence
    summary: Two large providers published profiles that do not pass the common suite.
