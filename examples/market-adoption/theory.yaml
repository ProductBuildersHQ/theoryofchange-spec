metrics:
  - id: met-adopters
    name: Organizations shipping or running the standard
    definition: Distinct organizations with the standard in production.
    formula: Count of distinct organizations with receipts in production, summed across categories.
    unit: organizations
    direction: increase
    aggregation: sum
    layer: common
    provenance:
      basis: confirmed
      decidedAt: "2026-02-10"
      decidedBy: Delegation Standard Working Group steering group
  - id: met-coverage
    name: Market coverage
    definition: Share of a reference population covered, weighted by the number of adopters involved.
    formula: Sum over segments of covered share times adopters in the segment, divided by total adopters across segments.
    unit: percent
    direction: increase
    aggregation: weighted_mean
    weightMetricId: met-adopters
    layer: pathway
    provenance:
      basis: inferred
      evidenceIds:
        - ev-buyer-survey
