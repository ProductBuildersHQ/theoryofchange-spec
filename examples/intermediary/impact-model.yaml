metrics:
  - id: met-attendee-hours
    name: Attendee hours
    definition: Total time that member staff and board members spend in network sessions.
    formula: Sum over all sessions in the trailing twelve months of (attendees from member organizations times session length in hours)
    unit: hours
    direction: increase
    aggregation: sum
    layer: common
    provenance:
      basis: confirmed
      decidedAt: "2026-04-14"
      decidedBy: Staff measurement group
  - id: met-orgs-reached
    name: Member organizations reached
    definition: How many different member organizations took part in a network activity. This is a distinct count, so values from different program areas must not be added, because one member that joins a cohort and a forum would be counted twice. Count the network-wide figure directly.
    formula: Count of distinct member organization ids with at least one attendee or service record in the trailing twelve months
    unit: member organizations
    direction: increase
    aggregation: none
    layer: common
    provenance:
      basis: confirmed
      decidedAt: "2026-04-14"
      decidedBy: Staff measurement group
  - id: met-enrollments
    name: Participant enrollments
    definition: Participants who joined a program cycle, used to weight retention rates.
    formula: Count of participants enrolled at the start of the program cycle
    unit: participants
    direction: increase
    aggregation: sum
    layer: pathway
  - id: met-retention-rate
    name: Participant retention rate
    definition: Share of participants who stay active to the end of a program cycle. Combining program areas weights each rate by its enrollments.
    formula: Participants active at cycle end divided by participants enrolled at cycle start, times 100
    unit: percent
    direction: increase
    aggregation: weighted_mean
    weightMetricId: met-enrollments
    layer: pathway
  - id: met-practice-maturity
    name: Leadership practice maturity
    definition: A member's level on a four-step rubric of leadership practice. Ordered levels cannot be averaged, so they are reported as a median level.
    formula: Median rubric level across rated members, where levels are Ad hoc, Emerging, Established, Exemplary
    unit: rubric level
    direction: increase
    aggregation: none
    layer: pathway
  - id: met-overhead-share
    name: Back-office share of budget
    definition: The portion of a member's operating budget spent on back-office functions.
    formula: Back-office spending divided by total operating expenses, times 100, averaged across reporting members
    unit: percent
    direction: decrease
    aggregation: mean
    layer: pathway
  - id: met-grant-applications
    name: Grant applications submitted
    definition: Applications that members send to funders.
    formula: Count of applications submitted by reporting members in the trailing twelve months
    unit: applications
    direction: increase
    aggregation: sum
    layer: pathway
  - id: met-residents-reached
    name: Residents reached
    definition: Residents who used a member service. Residents who use several members are counted more than once, so values from members cannot be added into a count of unique people.
    formula: Count of residents reported by members as having used at least one service in the year
    unit: residents
    direction: increase
    aggregation: none
    layer: pathway
glossary:
  - id: term-output
    term: Output
    definition: A direct product of the network's own work, within its control.
    examples:
      - Twelve cohort sessions held in a year
      - A pooled bookkeeping contract signed
    relatedIds:
      - oc-out-cohorts
      - oc-out-services
  - id: term-outcome
    term: Outcome
    definition: A change in members or in the actors around them that must happen for the theory to work, stated as a condition and not as an activity.
    examples:
      - Member leaders apply improved management practices
      - Local officials and funders engage members in planning
    relatedIds:
      - oc-im-leaders-practice
      - oc-im-officials-engage
  - id: term-impact
    term: Impact
    definition: Change for residents of the county, which the network contributes to but does not own.
    examples:
      - Residents get timely, good-quality services from local nonprofits
    relatedIds:
      - oc-resident-access
      - oc-resident-voice
  - id: term-member
    term: Member organization
    definition: A nonprofit in the county that has joined the network. The network counts members, not individual staff.
    relatedIds:
      - act-members-small
      - act-members-large
  - id: term-joint-position
    term: Joint position
    definition: A written position on a local issue that at least ten member organizations have formally signed.
    examples:
      - A shared statement asking the county for earlier notice of planning meetings
    relatedIds:
      - oc-im-joint-positions
  - id: term-pooled-services
    term: Pooled services
    definition: Back-office services such as bookkeeping and payroll that several members buy together to lower cost and effort.
    relatedIds:
      - int-pooled-backoffice
  - id: term-attribution
    term: Attribution and contribution
    definition: Attribution means the network can credit a result to its own work, as with hours it delivered. Contribution means the network played a part but other forces matter, as with resident outcomes.
    relatedIds:
      - ind-hours-total
      - ind-residents-served
causes:
  - id: cause-no-standing-voice
    statement: Members have no standing channel to speak with one voice to local government and funders.
    level: structural
    affectedGroupIds:
      - tg-small-members
  - id: cause-isolation
    statement: Each organization works alone, so effort and costs are duplicated.
    level: underlying
    parent: cause-no-standing-voice
  - id: cause-no-peer-exchange
    statement: Leaders get little management support or peer exchange.
    level: immediate
    parent: cause-isolation
    affectedGroupIds:
      - tg-small-members
    evidenceIds:
      - ev-member-survey
  - id: cause-high-overhead
    statement: Back-office work takes scarce staff time.
    level: immediate
    parent: cause-isolation
    affectedGroupIds:
      - tg-small-members
  - id: cause-funding-volatility
    statement: Grant funding is unpredictable and concentrated in a few funders.
    level: underlying
    outOfScope:
      reason: Funder behavior is outside what the network can change; it only widens the pipeline.
targetGroups:
