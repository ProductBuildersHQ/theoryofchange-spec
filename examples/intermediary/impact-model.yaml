kind: ImpactModel
specVersion: "0.1"
id: riverbend-network
metadata:
  name: Riverbend Nonprofit Network theory of change
  description: Fictional example for an intermediary organization with three program areas.
  status: draft
  owner: Riverbend Nonprofit Network staff
  tags:
    - intermediary
    - example
    - fictional
perspective:
  actorId: act-network
  role: proponent
context:
  problemStatement: Small and mid-sized nonprofits in Riverbend County spend scarce staff time on back-office work and grant hunting, work alone on shared problems, and are rarely heard in local planning, so residents get fewer and less reliable services than the need requires.
  rootCauses:
    - Leaders are promoted for program skill and get little management support or peer exchange.
    - Each organization buys back-office help and tracks funding alone, so costs are high and effort is duplicated.
    - There is no standing channel through which members speak with one voice to local government and funders.
  targetPopulation: About 150 member nonprofits, and through them the residents of Riverbend County who use their services.
  geography: Riverbend County (a fictional county)
  timeHorizon:
    start: "2026-01-01"
    end: "2028-12-31"
  mission: Strengthen the nonprofits of Riverbend County so that residents get timely, good-quality services.
  vision: A county where every resident can count on a strong local nonprofit when they need one.
  narrative: Riverbend Nonprofit Network is a membership network with about 8 staff. It works through three program areas, each a pathway in this theory. Learning Exchange builds leadership and peer ties, Shared Services lowers overhead and widens the grant pipeline, and Civic Voice helps members take joint positions and be heard by local government and funders. The three pathways converge on shared long-term outcomes about member collaboration, then on resident-level impact. Layer 1 is change in member nonprofits, which the network influences and measures directly. Layer 2 is change for residents, which the network tracks and contributes to but does not own.
ceilingOfAccountability:
  level: long_term
  rationale: The network answers for the capability, collaboration, funding stability, and collective voice of its members. Resident-level change depends on many forces besides the members' strength, such as demand, public funding, and the economy, so it is tracked and contributed to but not owned.
outcomes:
  - id: oc-resident-access
    title: Residents get timely, good-quality services from local nonprofits
    description: Layer 2 impact. People in the county who need community services can reach them without long waits.
    level: impact
    sphere: interest
    logic:
      type: all
    category: service access
    changeType: condition
    population: Residents of Riverbend County who use nonprofit services
    actorIds:
      - act-residents
    responsibility: shared
    deliveredBy:
      - act-network
      - act-members-small
      - act-members-large
    targetGroupIds:
      - tg-low-access-residents
    priority:
      scores:
        - criterionId: crit-equity
          score: 5
        - criterionId: crit-advantage
          score: 2
          note: Members deliver services; the network enables them.
      rationale: The reason the network exists, but only partly in its hands.
    audienceIds:
      - aud-funders
    provenance:
      basis: inferred
      evidenceIds:
        - ev-county-services
      note: Inferred from the county services report that wait times track member capacity.
  - id: oc-resident-voice
    title: Residents' priorities shape local public decisions
    description: Layer 2 impact. Planning and funding decisions reflect what residents say they need.
    level: impact
    sphere: interest
    logic:
      type: all
    category: civic voice
    changeType: condition
    population: Residents of Riverbend County
    actorIds:
      - act-residents
    provenance:
      basis: hypothesis
      note: Proposed in the staff workshop; no direct evidence yet.
  - id: oc-lt-capable-members
    title: Member nonprofits run strong, well-managed organizations
    description: Layer 1. Members show sound leadership practice with low overhead.
    level: long_term
    sphere: influence
    category: capability
    changeType: practice
    population: Member nonprofits
    actorIds:
      - act-members-small
      - act-members-large
    audienceIds:
      - aud-board
      - aud-funders
    provenance:
      basis: confirmed
      decidedAt: "2026-02-10"
      decidedBy: Network board
  - id: oc-lt-collab
    title: Members routinely collaborate instead of duplicating effort
    description: Layer 1. Members share contracts, referrals, and joint work. Three pathways converge here.
    level: long_term
    sphere: influence
    category: collaboration
    changeType: behavior
    population: Member nonprofits
    actorIds:
      - act-members-small
      - act-members-large
    provenance:
      basis: confirmed
      decidedAt: "2026-02-10"
      decidedBy: Network board
  - id: oc-lt-sustainable
    title: Members have diversified, stable funding
    description: Layer 1. Members hold several funding sources and are less exposed to the loss of one.
    level: long_term
    sphere: influence
    logic:
      type: any
    category: sustainability
    changeType: condition
    population: Member nonprofits
    actorIds:
      - act-members-small
    provenance:
      basis: inferred
      evidenceIds:
        - ev-member-survey
      note: Either lower costs or more grant applications could improve stability.
  - id: oc-lt-collective-voice
    title: Local government and funders consult members through a coordinated channel
    description: Layer 1. Officials and funders ask the network, not each member, for input on local issues.
    level: long_term
    sphere: influence
    category: voice
    changeType: norm
    population: Local government offices and regional funders
    actorIds:
      - act-county-office
      - act-regional-funder
      - act-city-council
    addressesCauses:
      - cause-no-standing-voice
      - cause-isolation
    audienceIds:
      - aud-board
    provenance:
      basis: hypothesis
      note: Depends on officials accepting a coordinated channel.
  - id: oc-im-leaders-practice
    title: Member leaders apply improved management practices
    level: medium_term
    sphere: influence
    category: capability
    changeType: practice
    population: Executive directors and senior staff of members
    actorIds:
      - act-members-small
      - act-members-large
    provenance:
      basis: stated
      evidenceIds:
        - ev-peer-learning
      note: The review reports that peer cohorts with coaching change leadership practice.
  - id: oc-im-peer-network
    title: Members turn to each other for advice and joint work
    level: medium_term
    sphere: influence
    category: collaboration
    changeType: behavior
    population: Member nonprofits
    actorIds:
      - act-members-small
      - act-members-large
    addressesCauses:
      - cause-no-peer-exchange
    targetGroupIds:
      - tg-small-members
    priority:
      scores:
        - criterionId: crit-equity
          score: 4
        - criterionId: crit-advantage
          score: 5
        - criterionId: crit-evidence
          score: 4
      rationale: Cheapest way to reach small members; strong evidence from other networks.
    provenance:
      basis: inferred
      evidenceIds:
        - ev-peer-learning
  - id: oc-im-lower-overhead
    title: Members spend less staff time and money on back-office work
    level: medium_term
    sphere: influence
    category: capability
    changeType: condition
    population: Members using pooled services
    actorIds:
      - act-members-small
    addressesCauses:
      - cause-high-overhead
    priority:
      scores:
        - criterionId: crit-equity
          score: 4
        - criterionId: crit-advantage
          score: 3
        - criterionId: crit-evidence
          score: 3
    audienceIds:
      - aud-members
    provenance:
      basis: stated
      evidenceIds:
        - ev-member-survey
        - ev-pooled-purchasing
      note: Members named back-office load as their largest drag on program time.
  - id: oc-im-grant-pipeline
    title: Members apply for more grants that fit their mission
    level: medium_term
    sphere: influence
    category: sustainability
    changeType: behavior
    population: Members using the shared grants calendar
    actorIds:
      - act-members-small
      - act-regional-funder
    provenance:
      basis: inferred
      evidenceIds:
        - ev-member-survey
  - id: oc-im-joint-positions
    title: Members adopt and share joint positions on local issues
    level: medium_term
    sphere: influence
    logic:
      type: all
    category: voice
    changeType: policy
    population: Member nonprofits
    actorIds:
      - act-members-small
      - act-members-large
    provenance:
      basis: hypothesis
  - id: oc-im-officials-engage
    title: Local officials and funders engage members in planning
    level: medium_term
    sphere: influence
    category: voice
    changeType: adoption
    population: County and municipal planning staff, regional funder program staff
    actorIds:
      - act-county-office
      - act-city-council
      - act-regional-funder
    responsibility: partner
    deliveredBy:
      - act-county-office
      - act-city-council
    addressesCauses:
      - cause-no-standing-voice
    audienceIds:
      - aud-county
    provenance:
      basis: confirmed
      decidedAt: "2026-02-10"
      decidedBy: Network board
  - id: oc-st-leader-skills
    title: Leaders gain coaching-based skills and confidence
    level: short_term
    sphere: influence
    category: capability
    changeType: skill
    population: Executive directors and senior staff of members
    actorIds:
      - act-members-small
      - act-members-large
    provenance:
      basis: stated
      evidenceIds:
        - ev-peer-learning
  - id: oc-st-peer-ties
    title: Members form peer relationships across sizes
    level: short_term
    sphere: influence
    category: collaboration
    changeType: attitude
    population: Member nonprofits
    actorIds:
      - act-members-small
      - act-members-large
    provenance:
      basis: inferred
      evidenceIds:
        - ev-peer-learning
  - id: oc-st-pooled-use
    title: Members use pooled back-office services
    level: short_term
    sphere: influence
    category: capability
    changeType: adoption
    population: Member nonprofits
    actorIds:
      - act-members-small
    provenance:
      basis: inferred
      evidenceIds:
        - ev-pooled-purchasing
  - id: oc-st-calendar-use
    title: Members consult the shared grants calendar when planning
    level: short_term
    sphere: influence
    category: sustainability
    changeType: behavior
    population: Member development staff
    actorIds:
      - act-members-small
    provenance:
      basis: hypothesis
  - id: oc-st-policy-know
    title: Members understand local policy and funding processes
    level: short_term
    sphere: influence
    category: voice
    changeType: knowledge
    population: Member leaders and board members
    actorIds:
      - act-members-small
      - act-members-large
    provenance:
      basis: inferred
      evidenceIds:
        - ev-workshop-notes
  - id: oc-st-channel
    title: A standing channel exists between members and the county planning office
    level: short_term
    sphere: influence
    category: voice
    changeType: condition
    population: County planning staff and member representatives
    actorIds:
      - act-county-office
    provenance:
      basis: confirmed
      decidedAt: "2026-03-05"
      decidedBy: Civic Voice steering group
  - id: oc-out-cohorts
    title: Peer-learning cohorts and coaching sessions delivered
    level: output
    sphere: control
    category: learning
    changeType: condition
    provenance:
      basis: confirmed
      decidedAt: "2026-02-10"
      decidedBy: Network board
  - id: oc-out-services
    title: Pooled service contracts and group purchasing deals in place
    level: output
    sphere: control
    category: services
    changeType: condition
    provenance:
      basis: stated
      evidenceIds:
        - ev-pooled-purchasing
  - id: oc-out-calendar
    title: Shared grants calendar published and kept current
    level: output
    sphere: control
    category: services
    changeType: condition
    provenance:
      basis: inferred
      evidenceIds:
        - ev-member-survey
  - id: oc-out-briefings
    title: Policy briefings and joint-position drafts produced
    level: output
    sphere: control
    category: voice
    changeType: condition
    provenance:
      basis: hypothesis
  - id: oc-certified-members
    title: Members hold a network-issued quality certification
    description: Considered as a fourth program area and rejected by the member assembly.
    level: long_term
    sphere: influence
    category: capability
    changeType: condition
    provenance:
      basis: rejected
      note: Members feared a two-tier network and the cost of audits.
      decidedAt: "2026-03-20"
      decidedBy: Member assembly
preconditionGroups:
  - id: grp-capable
    target: oc-lt-capable-members
    members:
      - oc-im-leaders-practice
      - oc-im-lower-overhead
    logic:
      type: all
    sufficiency: Good practice without time freed from overhead does not stick, and freed time without better practice is not enough.
    provenance:
      basis: inferred
      evidenceIds:
        - ev-peer-learning
  - id: grp-collab
    target: oc-lt-collab
    members:
      - oc-im-peer-network
      - oc-im-lower-overhead
      - oc-im-joint-positions
    logic:
      type: at_least
      k: 2
    sufficiency: Any two of peer exchange, freed capacity, and shared positions are enough for routine collaboration to start.
    provenance:
      basis: hypothesis
  - id: grp-voice
    target: oc-lt-collective-voice
    members:
      - oc-im-joint-positions
      - oc-im-officials-engage
    logic:
      type: all
    sufficiency: A coordinated channel needs both a shared position to carry and an official who asks for it.
    provenance:
      basis: confirmed
      decidedAt: "2026-03-05"
      decidedBy: Civic Voice steering group
links:
  - id: ln-cohorts-skills
    from: oc-out-cohorts
    to: oc-st-leader-skills
    type: causes
    rationale: Leaders who attend cohorts and coaching practice the skills with peers.
    assumptionIds:
      - asm-time-to-attend
    evidenceIds:
      - ev-peer-learning
    interventionIds:
      - int-leader-coaching
      - int-training-series
    polarity: positive
    lag: P3M
    provenance:
      basis: stated
      evidenceIds:
        - ev-peer-learning
  - id: ln-cohorts-ties
    from: oc-out-cohorts
    to: oc-st-peer-ties
    type: causes
    rationale: Mixed-size cohorts give small and large members repeated contact.
    assumptionIds:
      - asm-time-to-attend
    interventionIds:
      - int-peer-cohorts
    polarity: positive
    lag: P3M
    provenance:
      basis: inferred
      evidenceIds:
        - ev-peer-learning
  - id: ln-skills-practice
    from: oc-st-leader-skills
    to: oc-im-leaders-practice
    type: causes
    rationale: Skills practiced in coaching are applied to staffing, finance, and board work once leaders return.
    assumptionIds:
      - asm-skills-applied
    evidenceIds:
      - ev-peer-learning
    polarity: positive
    lag: P6M
    provenance:
      basis: stated
      evidenceIds:
        - ev-peer-learning
  - id: ln-ties-network
    from: oc-st-peer-ties
    to: oc-im-peer-network
    type: enables
    rationale: Members ask peers they know and trust before they ask outsiders.
    assumptionIds:
      - asm-peer-trust
    polarity: positive
    lag: P6M
    provenance:
      basis: inferred
  - id: ln-practice-capable
    from: oc-im-leaders-practice
    to: oc-lt-capable-members
    type: necessary_condition
    rationale: Strong organizations need leaders who manage deliberately, not only program staff with strong skills.
    assumptionIds:
      - asm-leadership-turnover
    polarity: positive
    lag: P1Y
    provenance:
      basis: confirmed
      decidedAt: "2026-02-10"
      decidedBy: Network board
  - id: ln-network-collab
    from: oc-im-peer-network
    to: oc-lt-collab
    type: contributes_to
    rationale: Members who already exchange advice find it easier to share contracts and referrals.
    assumptionIds:
      - asm-peer-trust
    evidenceIds:
      - ev-collab-study
    polarity: positive
    lag: P1Y
    provenance:
      basis: inferred
      evidenceIds:
        - ev-collab-study
  - id: ln-services-use
    from: oc-out-services
    to: oc-st-pooled-use
    type: causes
    rationale: Members cannot use a service that does not exist, and clear terms lower the cost of trying it.
    assumptionIds:
      - asm-vendor-terms
    interventionIds:
      - int-pooled-backoffice
      - int-group-purchasing
    polarity: positive
    lag: P3M
    provenance:
      basis: stated
      evidenceIds:
        - ev-pooled-purchasing
  - id: ln-calendar-use
    from: oc-out-calendar
    to: oc-st-calendar-use
    type: causes
    rationale: A current calendar replaces the member's own scanning of funder websites.
    assumptionIds:
      - asm-calendar-reliable
    interventionIds:
      - int-grants-calendar
    polarity: positive
    lag: P3M
    provenance:
      basis: hypothesis
  - id: ln-pooled-overhead
    from: oc-st-pooled-use
    to: oc-im-lower-overhead
    type: causes
    rationale: Pooled bookkeeping and group purchasing replace duplicated work and lower unit costs.
    assumptionIds:
      - asm-vendor-terms
    evidenceIds:
      - ev-pooled-purchasing
    polarity: positive
    lag: P6M
    provenance:
      basis: stated
      evidenceIds:
        - ev-pooled-purchasing
  - id: ln-calendar-pipeline
    from: oc-st-calendar-use
    to: oc-im-grant-pipeline
    type: enables
    rationale: Members see deadlines earlier and apply to funders whose priorities match their mission.
    assumptionIds:
      - asm-calendar-reliable
    polarity: positive
    lag: P6M
    provenance:
      basis: inferred
      evidenceIds:
        - ev-member-survey
  - id: ln-overhead-capable
    from: oc-im-lower-overhead
    to: oc-lt-capable-members
    type: necessary_condition
    rationale: Freed staff time is what lets leaders apply what they learn.
    assumptionIds:
      - asm-savings-reinvested
    polarity: positive
    lag: P1Y
    provenance:
      basis: inferred
      evidenceIds:
        - ev-member-survey
  - id: ln-overhead-collab
    from: oc-im-lower-overhead
    to: oc-lt-collab
    type: contributes_to
    rationale: Members with spare capacity say yes to joint projects; stretched members do not.
    assumptionIds:
      - asm-savings-reinvested
    polarity: positive
    lag: P1Y
    provenance:
      basis: hypothesis
  - id: ln-overhead-sustain
    from: oc-im-lower-overhead
    to: oc-lt-sustainable
    type: contributes_to
    rationale: Lower fixed costs mean a smaller revenue gap and a smaller shock when a grant ends.
    assumptionIds:
      - asm-savings-reinvested
    polarity: positive
    lag: P1Y
    provenance:
      basis: inferred
      evidenceIds:
        - ev-pooled-purchasing
  - id: ln-pipeline-sustain
    from: oc-im-grant-pipeline
    to: oc-lt-sustainable
    type: contributes_to
    rationale: More well-matched applications add sources of funding and lower dependence on any one funder.
    assumptionIds:
      - asm-funders-fit
    polarity: positive
    lag: P1Y
    provenance:
      basis: inferred
      evidenceIds:
        - ev-member-survey
  - id: ln-briefings-know
    from: oc-out-briefings
    to: oc-st-policy-know
    type: causes
    rationale: Plain-language briefings explain the process, the calendar, and who decides.
    interventionIds:
      - int-policy-briefings
    polarity: positive
    lag: P3M
    provenance:
      basis: hypothesis
  - id: ln-know-positions
    from: oc-st-policy-know
    to: oc-im-joint-positions
    type: enables
    rationale: Members cannot agree on a position about a process they do not understand.
    assumptionIds:
      - asm-positions-hold
    interventionIds:
      - int-joint-forums
    polarity: positive
    lag: P6M
    provenance:
      basis: inferred
      evidenceIds:
        - ev-workshop-notes
  - id: ln-ties-positions
    from: oc-st-peer-ties
    to: oc-im-joint-positions
    type: enables
    rationale: Members who know each other settle on shared positions faster and with less friction. This link joins the Learning Exchange to Civic Voice.
    assumptionIds:
      - asm-peer-trust
    polarity: positive
    lag: P6M
    provenance:
      basis: hypothesis
  - id: ln-positions-collab
    from: oc-im-joint-positions
    to: oc-lt-collab
    type: contributes_to
    rationale: Agreeing on a position is itself a form of joint work that members repeat on other topics.
    assumptionIds:
      - asm-positions-hold
    polarity: positive
    lag: P1Y
    provenance:
      basis: hypothesis
  - id: ln-positions-voice
    from: oc-im-joint-positions
    to: oc-lt-collective-voice
    type: necessary_condition
    rationale: Officials can consult one network only if it has a position to carry.
    assumptionIds:
      - asm-positions-hold
    polarity: positive
    lag: P1Y
    provenance:
      basis: confirmed
      decidedAt: "2026-03-05"
      decidedBy: Civic Voice steering group
  - id: ln-officials-voice
    from: oc-im-officials-engage
    to: oc-lt-collective-voice
    type: necessary_condition
    rationale: A coordinated channel exists only when officials actually use it.
    assumptionIds:
      - asm-officials-receptive
    polarity: positive
    lag: P1Y
    provenance:
      basis: confirmed
      decidedAt: "2026-03-05"
      decidedBy: Civic Voice steering group
  - id: ln-channel-officials
    from: oc-st-channel
    to: oc-im-officials-engage
    type: enables
    rationale: A named contact and a regular meeting make it easy for planning staff to include members.
    assumptionIds:
      - asm-officials-receptive
    interventionIds:
      - int-liaison-channel
      - int-funder-roundtable
    polarity: positive
    lag: P6M
    provenance:
      basis: stated
      evidenceIds:
        - ev-funder-interview
  - id: ln-capable-access
    from: oc-lt-capable-members
    to: oc-resident-access
    type: contributes_to
    rationale: Better-run members deliver more and better services with the same funding.
    assumptionIds:
      - asm-members-deliver
    evidenceIds:
      - ev-county-services
    polarity: positive
    lag: P1Y
    provenance:
      basis: inferred
      evidenceIds:
        - ev-county-services
  - id: ln-collab-access
    from: oc-lt-collab
    to: oc-resident-access
    type: contributes_to
    rationale: Joint work and referrals reduce gaps and duplicate waiting lists for residents.
    assumptionIds:
      - asm-members-deliver
    polarity: positive
    lag: P1Y
    provenance:
      basis: hypothesis
  - id: ln-sustain-access
    from: oc-lt-sustainable
    to: oc-resident-access
    type: contributes_to
    rationale: Stable funding keeps programs open instead of closing when a grant ends.
    assumptionIds:
      - asm-members-deliver
    polarity: positive
    lag: P1Y
    provenance:
      basis: inferred
      evidenceIds:
        - ev-county-services
  - id: ln-voice-resvoice
    from: oc-lt-collective-voice
    to: oc-resident-voice
    type: contributes_to
    rationale: When officials consult the members who serve residents, resident priorities reach decisions.
    assumptionIds:
      - asm-officials-receptive
    polarity: positive
    lag: P2Y
    provenance:
      basis: hypothesis
  - id: ln-collab-resvoice
    from: oc-lt-collab
    to: oc-resident-voice
    type: contributes_to
    rationale: Members that work together carry resident feedback to officials with more weight.
    assumptionIds:
      - asm-positions-hold
    polarity: positive
    lag: P2Y
    provenance:
      basis: hypothesis
  - id: ln-collab-recruit
    from: oc-lt-collab
    to: oc-st-peer-ties
    type: enables
    rationale: Members who benefit from collaborating recruit peers into cohorts and events, which widens the peer ties the network builds.
    assumptionIds:
      - asm-peers-recruit
    polarity: positive
    feedback: true
    loopType: reinforcing
    lag: P1Y
    provenance:
      basis: inferred
      evidenceIds:
        - ev-workshop-notes
  - id: ln-cert-capable
    from: oc-certified-members
    to: oc-lt-capable-members
    type: contributes_to
    rationale: A certification was expected to signal and enforce good practice.
    polarity: positive
    provenance:
      basis: rejected
      decidedAt: "2026-03-20"
      decidedBy: Member assembly
interventions:
  - id: int-peer-cohorts
    title: Run mixed-size peer-learning cohorts
    description: Cohorts of 10 to 12 leaders meet monthly for a year, mixing small and large members.
    type: program
    targets:
      - oc-out-cohorts
      - oc-st-peer-ties
    outputs:
      - Cohort sessions held
      - Peer-pairing introductions
    ownerActorId: act-network
    status: in_progress
    resources: Two program staff and meeting space donated by the county library system
    priority:
      scores:
        - criterionId: crit-feasibility
          score: 5
        - criterionId: crit-reach
          score: 4
      rationale: Eight staff can run it with volunteer hosts.
    provenance:
      basis: confirmed
      decidedAt: "2026-02-10"
      decidedBy: Network board
  - id: int-leader-coaching
    title: Offer one-to-one leadership coaching
    type: program
    targets:
      - oc-out-cohorts
      - oc-st-leader-skills
    outputs:
      - Coaching hours delivered
