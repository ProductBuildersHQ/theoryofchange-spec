evidence:
  - id: ev-member-survey
    title: Riverbend member needs survey 2025
    type: research
    strength: moderate
    direction: supports
    processTracingTest: straw_in_the_wind
    source: Riverbend Nonprofit Network
    url: https://example.org/riverbend/member-survey-2025
    summary: Members ranked back-office load and funding search among their top constraints.
    excerpt: Seven in ten members said back-office work crowds out program time.
    sensitivity: public
    accessedAt: "2026-01-12"
  - id: ev-peer-learning
    title: Peer learning cohorts and nonprofit practice change, a review
    type: research
    strength: moderate
    direction: supports
    processTracingTest: hoop
    source: Example Institute for Nonprofit Studies
    url: https://example.org/institute/peer-learning-review
    summary: Cohorts combined with coaching were more likely to change leadership practice than workshops alone.
    excerpt: Programs that paired cohorts with coaching reported the largest shifts in management practice.
    sensitivity: public
    accessedAt: "2026-01-14"
  - id: ev-pooled-purchasing
    title: Group purchasing among small nonprofits in a neighboring region
    type: case_study
    strength: moderate
    direction: supports
    processTracingTest: straw_in_the_wind
    source: Example Regional Nonprofit Association
    url: https://example.org/association/group-purchasing-case
    summary: A comparable network cut members' shared-services costs after it pooled bookkeeping and supply orders.
    excerpt: Participating members reduced back-office spending after the first full year of pooled services.
    sensitivity: public
    accessedAt: "2026-01-20"
  - id: ev-county-services
    title: County community services report 2025
    type: monitoring_data
    strength: moderate
    direction: supports
    source: Riverbend County (fictional)
    url: https://example.org/county/community-services-2025
    summary: Reports service volumes, waits, and the annual resident survey for the county.
    excerpt: Waits for nonprofit-delivered services were longest in areas served only by small organizations.
    sensitivity: public
    accessedAt: "2026-01-22"
  - id: ev-funder-interview
    title: Interview notes with a regional funder program officer
    type: stakeholder_testimony
    strength: weak
    direction: supports
    source: Network staff interview
    summary: The funder is open to a members' roundtable but reserves the right to change priorities each cycle. Notes include candid remarks that are not for circulation.
    sensitivity: restricted
    accessedAt: "2026-02-18"
  - id: ev-workshop-notes
    title: Staff theory of change workshop notes
    type: stakeholder_testimony
    strength: weak
    direction: supports
    source: Network staff workshop
    url: https://example.org/riverbend/staff-workshop-notes
    summary: Staff described members recruiting peers after good experiences and doubted that members could hold a joint position.
    excerpt: Members who enjoyed a cohort kept bringing a friend to the next one.
    sensitivity: public
    accessedAt: "2026-02-05"
  - id: ev-collab-study
    title: Collaboration and power imbalance in nonprofit networks
    type: research
    strength: moderate
    direction: contradicts
    processTracingTest: hoop
    source: Example Journal of Civic Networks
    url: https://example.org/journal/collaboration-power-imbalance
    summary: Large members can dominate shared agendas, which weakens collaboration unless norms protect small members.
    excerpt: Where larger members set the agenda, small members reduced their participation within a year.
    sensitivity: public
    accessedAt: "2026-01-30"
  - id: ev-attendance-records
    title: Network attendance records 2025
    type: internal_metric
    strength: strong
    direction: supports
    source: Riverbend Nonprofit Network
    url: https://example.org/riverbend/attendance-summary-2025
    summary: Aggregated attendance by program area and member, with no individual names.
    sensitivity: public
    accessedAt: "2026-01-10"
  - id: ev-county-planning-notes
    title: County planning staff comments on engaging the nonprofit sector
    type: stakeholder_testimony
    strength: moderate
    direction: supports
    source: Riverbend County planning office (fictional)
    url: https://example.org/riverbend/planning-comments
    summary: Planning staff said they lack a quick way to reach the nonprofit sector and would use a named contact.
    excerpt: We would invite providers earlier if there were one contact to ask.
    sensitivity: public
    accessedAt: "2026-03-19"
  - id: ev-coalition-case
    title: Joint positions in a neighboring county's nonprofit coalition
    type: case_study
    strength: weak
    direction: supports
    source: Example Institute for Nonprofit Studies
    url: https://example.org/institute/coalition-positions
    summary: Coalitions that agreed a process for dissent kept most members publicly aligned after a joint position.
    sensitivity: public
    accessedAt: "2026-03-10"
externalFactors:
  - id: ef-county-budget
    description: The county's annual budget cycle sets how much it can fund community planning and services.
    kind: constraint
    affects:
      - oc-im-officials-engage
      - oc-resident-access
    likelihood: high
    trend: flat
    provenance:
      basis: inferred
      evidenceIds:
        - ev-county-services
  - id: ef-funder-priorities
    description: Regional funders may shift priorities away from general operating support.
    kind: trend
    affects:
      - oc-lt-sustainable
      - oc-im-grant-pipeline
    likelihood: medium
    trend: up
    provenance:
      basis: stated
      evidenceIds:
        - ev-funder-interview
  - id: ef-downturn
    description: A regional economic downturn would raise service demand and cut donations at the same time.
    kind: shock
    affects:
      - oc-resident-access
      - oc-lt-sustainable
    likelihood: low
    trend: unknown
    provenance:
      basis: hypothesis
  - id: ef-open-meetings
    description: A planned county rule would require planning bodies to publish early notice of meetings.
    kind: enabler
    affects:
      - oc-st-channel
      - oc-im-officials-engage
    likelihood: medium
    trend: up
    provenance:
      basis: inferred
      evidenceIds:
        - ev-county-services
risks:
  - id: rsk-time-burden
    description: Leaders drop out of cohorts because they cannot spare the time.
    impact: medium
    probability: medium
    mitigation: Hold sessions at off-peak hours, offer remote options, and review attendance each quarter.
    status: open
    owner: Learning Exchange lead
    appliesTo:
      - ln-cohorts-skills
    category: operational
    relatedAssumptionIds:
      - asm-time-to-attend
    provenance:
      basis: stated
      evidenceIds:
        - ev-attendance-records
  - id: rsk-large-dominate
    description: Larger members dominate shared agendas and smaller members withdraw.
    impact: high
    probability: medium
    mitigation: Rotate facilitation, cap vote weights, and give small members a seat on each steering group.
    status: open
    owner: Network board
    appliesTo:
      - oc-lt-collab
      - oc-im-joint-positions
    category: partnership
    relatedAssumptionIds:
      - asm-peer-trust
      - asm-positions-hold
    provenance:
      basis: inferred
      evidenceIds:
        - ev-collab-study
  - id: rsk-vendor-lockin
    description: A single pooled-service vendor becomes a critical dependency and raises prices after the first term.
    impact: medium
    probability: low
    mitigation: Sign short initial terms, keep two qualified vendors, and review prices each year.
    status: open
    owner: Shared Services coordinator
    appliesTo:
      - int-pooled-backoffice
      - int-group-purchasing
    category: market
    relatedAssumptionIds:
      - asm-vendor-terms
    provenance:
