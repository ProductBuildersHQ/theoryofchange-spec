assumptions:
  - id: asm-time-to-attend
    statement: Member leaders can free enough time to attend cohort sessions and coaching.
    ifThenBecause:
      if: sessions are held at off-peak times and at no cost
      then: leaders attend most sessions
      because: attendance in past pilot sessions fell mainly when sessions clashed with service delivery
    type: implementation
    appliesTo:
      - ln-cohorts-skills
      - ln-cohorts-ties
    criticality: high
    plausibility: medium
    explainsFully: false
    needsTesting: true
    test: Track the share of enrolled leaders who attend at least three quarters of sessions, and ask drop-outs why they left.
    indicatorIds:
      - ind-attendance-rate
    evidenceIds:
      - ev-attendance-records
    status: holding
    ownerActorId: act-network
    provenance:
      basis: stated
      evidenceIds:
        - ev-attendance-records
  - id: asm-skills-applied
    statement: Leaders put coaching-based skills into practice back at their organizations.
    ifThenBecause:
      if: leaders finish coaching with a concrete plan
      then: they change how they manage staff, money, and the board
      because: plans with named next steps are more likely to be carried out
    type: behavioral
    appliesTo:
      - ln-skills-practice
    criticality: critical
    plausibility: medium
    explainsFully: false
    needsTesting: true
    test: Interview a sample of cohort graduates six months later and score their practice with the maturity rubric.
    indicatorIds:
      - ind-practice-maturity
    evidenceIds:
      - ev-peer-learning
    status: untested
    ownerActorId: act-network
    provenance:
      basis: inferred
      evidenceIds:
        - ev-peer-learning
  - id: asm-peer-trust
    statement: Small and large members come to see each other as peers rather than as competitors for the same funding.
    type: contextual
    appliesTo:
      - ln-ties-network
      - ln-network-collab
      - ln-ties-positions
    criticality: medium
    plausibility: medium
    evidenceIds:
      - ev-collab-study
    status: untested
    provenance:
      basis: hypothesis
      note: The collaboration study warns that large members may dominate.
  - id: asm-vendor-terms
    statement: Vendors offer meaningful discounts and service terms at the volume the members can pool.
    ifThenBecause:
      if: members commit volume together
      then: vendors offer lower prices and simpler terms than members get alone
      because: vendors value predictable volume and fewer small accounts
    type: external
    appliesTo:
      - ln-services-use
      - ln-pooled-overhead
    criticality: high
    plausibility: medium
    needsTesting: true
    test: Compare pooled vendor quotes with the prices a sample of members pay now, before signing each agreement.
    indicatorIds:
      - ind-overhead-share
    evidenceIds:
      - ev-pooled-purchasing
    status: holding
    ownerActorId: act-network
    provenance:
      basis: stated
      evidenceIds:
        - ev-pooled-purchasing
  - id: asm-calendar-reliable
    statement: The grants calendar stays accurate enough that members trust it.
    type: implementation
    appliesTo:
      - ln-calendar-use
      - ln-calendar-pipeline
    criticality: medium
    plausibility: high
    status: holding
    ownerActorId: act-network
    provenance:
      basis: hypothesis
  - id: asm-savings-reinvested
    statement: Time and money saved on overhead are reinvested in programs, leadership, and joint work rather than absorbed elsewhere.
    ifThenBecause:
      if: back-office cost and effort fall
      then: leaders put the capacity into mission work and joint projects
      because: members told us overhead is what crowds those activities out
    type: causal
    appliesTo:
      - ln-overhead-capable
      - ln-overhead-collab
      - ln-overhead-sustain
    criticality: medium
    plausibility: medium
    explainsFully: false
    evidenceIds:
      - ev-member-survey
    status: untested
    provenance:
      basis: inferred
      evidenceIds:
        - ev-member-survey
  - id: asm-funders-fit
    statement: Regional funders keep funding priorities open enough that better-matched applications succeed.
    type: external
    appliesTo:
      - ln-pipeline-sustain
    criticality: medium
    plausibility: medium
    evidenceIds:
      - ev-funder-interview
    status: at_risk
    provenance:
      basis: inferred
      evidenceIds:
        - ev-funder-interview
  - id: asm-officials-receptive
    statement: The county planning office and municipal councils stay open to a standing channel with the network.
    ifThenBecause:
      if: a named contact and a regular meeting exist
      then: planning staff invite members into planning work
      because: staff say they lack a quick way to reach the sector
    type: partnership
    appliesTo:
      - ln-channel-officials
      - ln-officials-voice
      - ln-voice-resvoice
    criticality: high
    plausibility: medium
    explainsFully: false
    needsTesting: true
    test: Review the county planning calendar each quarter for processes that invited members, and ask planning staff whether the channel was used.
    indicatorIds:
      - ind-officials-meetings
    evidenceIds:
      - ev-county-planning-notes
    status: at_risk
    ownerActorId: act-county-office
    provenance:
      basis: stated
      evidenceIds:
        - ev-county-planning-notes
  - id: asm-positions-hold
    statement: Once members adopt a joint position, they keep to it in public rather than splintering.
    type: behavioral
    appliesTo:
      - ln-know-positions
      - ln-positions-collab
      - ln-positions-voice
      - ln-collab-resvoice
    criticality: high
    plausibility: low
    needsTesting: true
    test: After each joint position, record whether any member publicly took a conflicting stance within the following quarter.
    indicatorIds:
      - ind-joint-positions
    evidenceIds:
      - ev-coalition-case
    status: untested
    ownerActorId: act-network
    provenance:
      basis: hypothesis
      evidenceIds:
        - ev-coalition-case
  - id: asm-members-deliver
    statement: Stronger, more connected, better-funded members deliver more and better services to residents.
    ifThenBecause:
      if: members are better managed, collaborate, and have stable funding
      then: more residents are served with shorter waits
      because: capacity and continuity are the limits that members name in the county services report
    type: causal
    appliesTo:
      - ln-capable-access
      - ln-collab-access
      - ln-sustain-access
    criticality: critical
    plausibility: medium
    explainsFully: false
    needsTesting: true
    test: Compare service volumes and waits at members with high and low maturity ratings, using the annual member service-count report.
    indicatorIds:
      - ind-residents-served
    evidenceIds:
      - ev-county-services
    status: untested
    provenance:
      basis: inferred
      evidenceIds:
        - ev-county-services
  - id: asm-peers-recruit
    statement: Members who benefit from the network recruit their peers.
    type: behavioral
    appliesTo:
      - ln-collab-recruit
    criticality: low
    plausibility: high
    evidenceIds:
      - ev-workshop-notes
    status: holding
    provenance:
      basis: stated
      evidenceIds:
        - ev-workshop-notes
  - id: asm-leadership-turnover
    statement: Leadership turnover at members stays low enough for new practices to take root.
    type: contextual
    appliesTo:
      - ln-practice-capable
    criticality: medium
    plausibility: medium
    status: untested
    provenance:
      basis: hypothesis
