themes:
  - id: thm-peer-help
    label: Members helping each other
    definition: A member describes getting or giving practical help to another member because of the network.
    includes:
      - advice calls
      - borrowed templates
    excludes:
      - help from outside the network
    examples:
      - I called another director about a hiring problem and she sent me her process.
    outcomeIds:
      - oc-st-peer-ties
      - oc-im-peer-network
  - id: thm-shared-savings
    label: Savings from shared services
    definition: A member describes time or money saved by using a pooled service.
    includes:
      - bookkeeping
      - group purchasing
    examples:
      - Our books are closed a week earlier.
    outcomeIds:
      - oc-im-lower-overhead
  - id: thm-heard-by-officials
    label: Heard by officials
    definition: A member or official describes members' joint view being considered in a decision.
    outcomeIds:
      - oc-im-officials-engage
      - oc-lt-collective-voice
  - id: thm-hard-to-attend
    label: Hard to attend
    definition: A member describes a barrier to taking part, such as time or travel.
    excludes:
      - cost of dues
    outcomeIds:
      - oc-st-leader-skills
selectionCriteria:
  - id: crit-decision-value
    name: Decision value
    question: Would the result change something the network decides?
    weight: 3
    appliesTo: indicator
  - id: crit-audience-value
    name: Audience value
    question: Does an audience we report to ask for it?
    weight: 2
    appliesTo: indicator
  - id: crit-cost
    name: Cost to collect
    question: How much staff time and member effort does it take?
    weight: 2
    appliesTo: indicator
    inverted: true
  - id: crit-consistency
    name: Consistency
    question: Can it be collected the same way every period?
    weight: 1
    appliesTo: indicator
  - id: crit-credibility
    name: Credibility
    question: Would a funder or member trust it?
    weight: 2
    appliesTo: indicator
  - id: crit-equity
    name: Equity
    question: Does it reach the members and residents least served?
    weight: 2
    appliesTo: outcome
  - id: crit-advantage
    name: Comparative advantage
    question: Is the network better placed to do this than anyone else?
    weight: 2
    appliesTo: outcome
  - id: crit-evidence
    name: Evidence of what works
    question: Is there evidence this path leads to the change?
    weight: 1
    appliesTo: outcome
  - id: crit-feasibility
    name: Feasibility
    question: Can eight staff deliver it?
    weight: 2
    appliesTo: intervention
  - id: crit-reach
    name: Reach
    question: How many members does it serve?
    weight: 1
    appliesTo: intervention
measurementBudget:
  staffMinutesPerWeek: 90
  maxQuestionsPerRespondentPerYear: 24
  targetSelectedMetrics:
    min: 8
    max: 12
consultations:
  - id: con-staff-workshop
    date: "2026-02-05"
    step: whole
    method: workshop
    stakeholderGroups:
      - Network staff
    count: 8
    findings:
      - Staff agreed on the three program areas and on the two impact layers.
      - Staff doubted that members would hold a joint position when funders compete.
    changedIds:
      - oc-lt-collab
      - asm-positions-hold
  - id: con-member-interviews
    date: "2026-02-24"
    step: change_analysis
    method: interview
    stakeholderGroups:
      - Small member nonprofits
      - Larger member nonprofits
    count: 12
    findings:
      - Small members asked for help with bookkeeping before any other service.
      - Larger members questioned the value of cohorts for them and asked for a say in the agenda.
    changedIds:
      - oc-im-lower-overhead
      - rsk-large-dominate
  - id: con-funder-interview
    date: "2026-03-02"
    step: assumptions_risks
    method: interview
    stakeholderGroups:
      - Regional funders
    count: 2
    findings:
      - The funder is open to a roundtable but may change its priorities each cycle.
    changedIds:
      - asm-funders-fit
      - rsk-funder-shift
  - id: con-assembly
    date: "2026-03-20"
    step: focus
    method: meeting
    stakeholderGroups:
      - Member assembly
    count: 41
    findings:
      - The assembly rejected a certification program and asked the network to focus on the three program areas.
    changedIds:
      - pw-certification
      - dec-certification
  - id: con-measurement-workshop
    date: "2026-04-14"
    step: measurement
    method: workshop
    stakeholderGroups:
      - Network staff
      - Member representatives
    count: 9
    findings:
      - Participants chose indicators that are already on sign-in sheets over new surveys.
      - Participants asked for one resident-level number even though it is only contributed to.
    changedIds:
      - ind-hours-learning
      - ind-residents-served
      - ind-attendance-rate
  - id: con-problem-tree-review
    date: "2026-03-05"
    step: change_analysis
    method: document_review
    stakeholderGroups:
      - Network board
    findings:
      - The board agreed that funding volatility is real but outside the network's reach.
    changedIds:
      - cause-funding-volatility
  - id: con-resident-listening
    date: "2026-03-12"
    step: focus
    method: interview
    stakeholderGroups:
      - Residents of low-access areas
      - Neighborhood association volunteers
    count: 14
    findings:
      - Residents named travel time and unclear eligibility as the main barriers to services.
      - Residents asked that members share intake forms so people tell their story once.
    changedIds:
      - tg-low-access-residents
      - oc-resident-access
  - id: con-county-staff
    date: "2026-03-19"
    step: actors
    method: meeting
    stakeholderGroups:
      - County planning staff
    count: 3
    findings:
      - Staff would use a named contact and a quarterly meeting.
      - Staff cannot commit to inviting members into every planning process.
    changedIds:
      - asm-officials-receptive
      - oc-st-channel
